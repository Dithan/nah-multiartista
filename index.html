<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Náh Multiartista</title>
    <meta
      name="description"
      content="Conheça o universo artístico de Náh Multiartista. Explore pinturas, ilustrações, literatura, composições e obras feitas com sensibilidade e criatividade."
    />
    <meta name="author" content="Náh Multiartista" />
    <meta name="robots" content="index, follow" />
    <!-- SEO / URL -->
    <link rel="canonical" href="https://www.nahmultiartista.com.br/" />

    <!-- Identidade visual do navegador -->
    <meta name="theme-color" content="#702c3b" />

    <!-- Open Graph: compartilhamento em redes sociais -->
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Náh Multiartista" />
    <meta property="og:title" content="Náh Multiartista | Arte e Expressão" />
    <meta
      property="og:description"
      content="Pinturas, ilustrações, literatura e composições que traduzem um universo de arte e sensibilidade."
    />
    <meta property="og:url" content="https://www.nahmultiartista.com.br/" />

    <meta
      property="og:image"
      content="https://www.nahmultiartista.com.br/assets/img/share.jpg"
    />
    <meta
      property="og:image:alt"
      content="Náh Multiartista, universo artístico de pinturas e ilustrações"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Náh Multiartista | Arte e Expressão" />
    <meta
      name="twitter:description"
      content="Conheça as pinturas, ilustrações, livros e criações de Náh Multiartista."
    />
    <meta
      name="twitter:image"
      content="https://www.seudominio.com.br/assets/img/og-image.jpg"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Náh Style -->
    <link rel="stylesheet" href="./styles/main.css?v=11" />
  </head>

  <body>
    <div id="header"></div>

    <main>
      <div id="hero"></div>
      <div id="about"></div>
      <div id="gallery"></div>
      <div id="process"></div>
      <div id="book"></div>
      <div id="contact"></div>
      <div id="footer"></div>
    </main>

    <script type="module" src="./js/dynamic-load.js"></script>
    <script type="module" src="./js/dynamic-color.js"></script>
    <script type="module" src="./js/menu-mobile.js"></script>

    <!-- AOS animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="./js/animations.js"></script>
  </body>
</html>
